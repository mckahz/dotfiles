bind=SUPER,Q,killclient
bind=SUPER,R,reload_config
bind=SUPER,Return,spawn,kitty
bind=SUPER,Space,spawn,noctalia msg panel-toggle launcher
# rofi -show run
bind=SUPER,Z,spawn,noctalia msg session lock
bind=SUPER,F,togglemaximizescreen
bind=SUPER+CTRL,F,togglefullscreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,U,focusmon,prev
bind=SUPER,I,focusmon,next
bind=SUPER+CTRL,U,tagmon,prev
bind=SUPER+CTRL,I,tagmon,next
bind=SUPER,V,togglefloating
bind=ALT,Tab,overcircle
bind=SUPER+SHIFT,S,spawn,hyprshot -m region -o /home/mckahz/Pictures/Screenshots

bind=SUPER,code:20,resizewin,-10,0
bind=SUPER,code:21,resizewin,+10,0
bind=SUPER+CTRL,code:20,resizewin,0,-10
bind=SUPER+CTRL,code:21,resizewin,0,+10

bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,j,move_client,down
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,l,move_client,right

# Check on desktop
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

gesturebind=none,down,3,viewprev_have_client
gesturebind=none,up,3,viewnext_have_client
gesturebind=none,right,3,toggleoverview
gesturebind=none,left,3,toggleoverview
