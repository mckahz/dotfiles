[active_window]
icon_size = 22

[bar]
order = [ "sidebar" ]

    [bar.sidebar]
    background_opacity = 0.73999998345971107
    capsule_thickness = 0.61999998986721039
    center = [ "screenshot", "clock", "cpu", "temp", "ram" ]
    end = [ "tray", "network", "bluetooth", "volume", "wallpaper", "battery", "control-center", "session" ]
    margin_ends = 0
    position = "left"
    radius_bottom_left = 0
    radius_top_left = 0
    scale = 1.2500000111758709
    start = [ "launcher", "workspaces", "active_window", "media", "audio_visualizer" ]
    thickness = 46
    widget_spacing = 12

